  <text x="70" y="52" font-family="Arial" font-size="3.5" fill="black">chessboard_scale(gray, inner_cols=9, inner_rows=6, square_mm=5.0)</text>
  <text x="70" y="58" font-family="Arial" font-size="3.5" fill="black">5mm squares deliberately, not smaller: chessboard_scale's own</text>
  <text x="70" y="63" font-family="Arial" font-size="3.5" fill="black">docstring warns that at 2mm squares, cornerSubPix noise alone</text>
  <text x="70" y="68" font-family="Arial" font-size="3.5" fill="black">eats half the 1.0% field-uniformity allowance, and the gate would</text>
  <text x="70" y="73" font-family="Arial" font-size="3.5" fill="black">warn on a board that is optically fine. Bigger board, not tighter gate.</text>
  <text x="70" y="82" font-family="Arial" font-size="3.5" font-weight="bold" fill="black">This is a fallback only. It is a SPECIMEN (printer</text>
  <text x="70" y="87" font-family="Arial" font-size="3.5" font-weight="bold" fill="black">accuracy), not a STANDARD - it exercises the decision</text>
  <text x="70" y="92" font-family="Arial" font-size="3.5" font-weight="bold" fill="black">bands, it does not validate the scale.</text>

  <text x="5" y="105" font-family="Arial" font-size="3" fill="#666">Generated for SIH26034 - backup scale artifact per Sep 8 of the execution plan, for if the glass graticule breaks or goes missing.</text>
