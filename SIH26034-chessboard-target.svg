<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="110mm" viewBox="0 0 180 110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="180" height="110" fill="white"/>

  <text x="5" y="8" font-family="Arial" font-size="4.5" font-weight="bold" fill="black">
    PRINT AT 100% / ACTUAL SIZE. DO NOT use "Fit to page" - this is a backup scale artifact, its whole job is a known square size.
  </text>

  <text x="5" y="18" font-family="Arial" font-size="4" font-weight="bold" fill="black">RULER CHECK - verify before use:</text>
  <line x1="5" y1="24" x2="55" y2="24" stroke="black" stroke-width="0.3"/>
  <line x1="5" y1="22" x2="5" y2="26" stroke="black" stroke-width="0.3"/>
  <line x1="55" y1="22" x2="55" y2="26" stroke="black" stroke-width="0.3"/>
  <text x="5" y="31" font-family="Arial" font-size="3.5" fill="black">This line must measure EXACTLY 50mm with a physical ruler. If not, reprint at 100%.</text>

  <text x="5" y="40" font-family="Arial" font-size="4" font-weight="bold" fill="black">9x6 inner corners, 5mm squares (SCALE_FROM_SPECIMEN - printer accuracy only, not a STANDARD)</text>

