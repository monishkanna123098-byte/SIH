<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="140mm" viewBox="0 0 180 140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="180" height="140" fill="white"/>

  <!-- ============================================================ -->
  <!-- PRINT INSTRUCTIONS - read before printing                    -->
  <!-- ============================================================ -->
  <text x="5" y="8" font-family="Arial" font-size="4.5" font-weight="bold" fill="black">
    PRINT AT 100% / ACTUAL SIZE. DO NOT use "Fit to page" or "Shrink to fit" - either one silently rescales every bar below.
  </text>

  <!-- ============================================================ -->
  <!-- RULER CHECK - verify this BEFORE trusting anything else on this sheet -->
  <!-- ============================================================ -->
  <text x="5" y="18" font-family="Arial" font-size="4" font-weight="bold" fill="black">RULER CHECK - measure this line with a physical ruler after printing:</text>
  <line x1="5" y1="24" x2="55" y2="24" stroke="black" stroke-width="0.3"/>
  <line x1="5" y1="22" x2="5" y2="26" stroke="black" stroke-width="0.3"/>
  <line x1="15" y1="23" x2="15" y2="25" stroke="black" stroke-width="0.2"/>
  <line x1="25" y1="23" x2="25" y2="25" stroke="black" stroke-width="0.2"/>
  <line x1="35" y1="23" x2="35" y2="25" stroke="black" stroke-width="0.2"/>
  <line x1="45" y1="23" x2="45" y2="25" stroke="black" stroke-width="0.2"/>
  <line x1="55" y1="22" x2="55" y2="26" stroke="black" stroke-width="0.3"/>
  <text x="5" y="31" font-family="Arial" font-size="3.5" fill="black">This line must measure EXACTLY 50mm end to end. If it doesn't, the print scale is wrong -</text>
  <text x="5" y="35" font-family="Arial" font-size="3.5" fill="black">reprint at 100%/actual size before using any bar below. Do not eyeball this - use a ruler.</text>

  <!-- ============================================================ -->
  <!-- BAR 1: 0.70mm - below the 1.0mm general requirement -->
  <!-- Expect DEFICIENT against CATEGORY_GENERAL -->
  <!-- ============================================================ -->
  <text x="5" y="50" font-family="Arial" font-size="4.5" font-weight="bold" fill="black">TARGET 1 - 0.70mm</text>
  <text x="5" y="55" font-family="Arial" font-size="3.5" fill="black">Below the 1.0mm general requirement. Expect: DEFICIENT.</text>
  <rect x="5" y="58" width="6" height="0.70" fill="black"/>
  <text x="20" y="61" font-family="Arial" font-size="3" fill="#666">(bar height = 0.70mm exactly, at true print scale)</text>

  <!-- ============================================================ -->
  <!-- BAR 2: 1.00mm - exactly at the general requirement -->
  <!-- Expect right at the boundary: likely REQUIRES_PHYSICAL_VERIFICATION -->
  <!-- since U straddles the threshold at h == TL -->
  <!-- ============================================================ -->
  <text x="5" y="75" font-family="Arial" font-size="4.5" font-weight="bold" fill="black">TARGET 2 - 1.00mm</text>
  <text x="5" y="80" font-family="Arial" font-size="3.5" fill="black">Exactly at the 1.0mm general requirement. Expect: the band straddles the</text>
  <text x="5" y="84" font-family="Arial" font-size="3.5" fill="black">line at h == TL, so REQUIRES_PHYSICAL_VERIFICATION is the correct,</text>
  <text x="5" y="88" font-family="Arial" font-size="3.5" fill="black">honest answer here - not a COMPLIANT verdict. If it prints as an outright</text>
  <text x="5" y="92" font-family="Arial" font-size="3.5" fill="black">DEFICIENT, expect print-scale error before real deficiency, at this margin.</text>
  <rect x="5" y="95" width="6" height="1.00" fill="black"/>
  <text x="20" y="99" font-family="Arial" font-size="3" fill="#666">(bar height = 1.00mm exactly, at true print scale)</text>

  <!-- ============================================================ -->
  <!-- BAR 3: 1.30mm - comfortably above the requirement -->
  <!-- Expect COMPLIANT -->
  <!-- ============================================================ -->
  <text x="5" y="115" font-family="Arial" font-size="4.5" font-weight="bold" fill="black">TARGET 3 - 1.30mm</text>
  <text x="5" y="120" font-family="Arial" font-size="3.5" fill="black">Comfortably above the 1.0mm general requirement. Expect: COMPLIANT.</text>
  <rect x="5" y="123" width="6" height="1.30" fill="black"/>
  <text x="20" y="127" font-family="Arial" font-size="3" fill="#666">(bar height = 1.30mm exactly, at true print scale)</text>

  <text x="5" y="136" font-family="Arial" font-size="3" fill="#666">
    Generated for SIH26034. Solid bars, not letterforms, on purpose - a filled rectangle gives an unambiguous 50% ink-to-substrate edge; a rendered character's cap-height-to-font-size ratio is font-dependent and would not hit these heights exactly.
  </text>
</svg>
